# Lowlighter Metrics — single job, sequential renders (no parallel push races).
# Requires repo secret METRICS_TOKEN. See .github/METRICS_TOKEN.md if you get Bad credentials.
name: Lowlighter Metrics

on:
  schedule:
    # Daily 00:00 UTC (~08:00 Asia/Taipei)
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      # Pin to released v3.34 — avoid @latest drift
      - name: Overview
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: humank
          template: classic
          base: header, activity, community, repositories, metadata
          filename: metrics/overview.svg
          config_timezone: Asia/Taipei
          config_display: large
          committer_message: "chore: update metrics/overview.svg [skip ci]"
          output_condition: data-changed

      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: humank
          template: classic
          base: ""
          filename: metrics/languages.svg
          config_timezone: Asia/Taipei
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 90
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          committer_message: "chore: update metrics/languages.svg [skip ci]"
          output_condition: data-changed

      - name: Starred topics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: humank
          template: classic
          base: ""
          filename: metrics/topics.svg
          config_timezone: Asia/Taipei
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0
          plugin_topics_sort: stars
          committer_message: "chore: update metrics/topics.svg [skip ci]"
          output_condition: data-changed

      - name: Coding habits
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: humank
          template: classic
          base: ""
          filename: metrics/habits.svg
          config_timezone: Asia/Taipei
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_from: 100
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: 0%
          committer_message: "chore: update metrics/habits.svg [skip ci]"
          output_condition: data-changed

      - name: Isometric calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: humank
          template: classic
          base: ""
          filename: metrics/isocalendar.svg
          config_timezone: Asia/Taipei
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          committer_message: "chore: update metrics/isocalendar.svg [skip ci]"
          output_condition: data-changed
